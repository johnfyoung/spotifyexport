{% extends "base.html" %}
{% block content %}
<section>
  <h2>Transfer favorites</h2>
  <p>Make sure your <code>YTMUSIC_COOKIE</code> environment variable is set before starting the transfer. The import will attempt to match up to 50 of your saved Spotify tracks.</p>
  <form action="{{ url_for('run_transfer') }}" method="post">
    <button class="primary" type="submit">Run transfer</button>
  </form>
</section>
{% endblock %}
